<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Recommendation - Contact Us</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="page">
  <nav class="navbar">
    <div class="logo">✈ TravelBloom</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <main class="content">
    <h1>Contact Us</h1>
    <section class="card">
      <h2>Contact Information</h2>
      <p><strong>Email:</strong> info@travelbloom.com</p>
      <p><strong>Phone:</strong> +1 (555) 123-4567</p>
      <p><strong>Address:</strong> 123 Travel Street, New York, NY, USA</p>
    </section>

    <section class="card">
      <h2>Send Us an Email</h2>
      <form id="contactForm" action="mailto:info@travelbloom.com" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Enter your message" required></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>
  <script>
    document.getElementById('contactForm').addEventListener('submit', function () {
      setTimeout(function () {
        alert('Thank you for contacting us! We will get back to you soon.');
      }, 100);
    });
  </script>
</body>
</html>
